name: Push digest
on:
  schedule:
    - cron: "0 4-14/2 * * 1-5"   # every 2 hours, 09:30-19:30 IST, weekdays
  workflow_dispatch:
    inputs:
      days: { description: "Window in days", default: "35" }
permissions:
  contents: write
concurrency: digest
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: pip install -r requirements.txt numpy
      - uses: actions/cache@v4   # five years of small exchange files; without this every run re-downloads them
        with: { path: data/cache/http, key: "http-${{ github.run_id }}", restore-keys: "http-" }
      - run: python -m finn.digest ${{ inputs.days || '35' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit the brief, the model cache and the run log
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add public/data data/cache/llm data/last-run.log
          git diff --cached --quiet || git commit -m "digest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
